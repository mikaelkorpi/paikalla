name: Paikalla cron

on:
  schedule:
    - cron: '0 5 * * 1'
    - cron: '0 12 * * 5'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cron route
        run: |
          if [ "${{ github.event.schedule }}" = "0 5 * * 1" ]; then
            curl -X POST https://paikalla.vercel.app/api/cron/open-poll \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          else
            curl -X POST https://paikalla.vercel.app/api/cron/close-poll \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          fi
